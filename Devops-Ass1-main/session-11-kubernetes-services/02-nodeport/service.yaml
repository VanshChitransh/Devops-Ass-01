# NodePort: opens 30080 on every node and forwards to the pods on 80
apiVersion: v1
kind: Service
metadata:
  name: web-service-nodeport
  labels:
    owner: vansh
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
