# Frontend: nginx serving a one-page site from a ConfigMap volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanshapp-frontend-html
  labels:
    app: vanshapp
    tier: frontend
    owner: vansh
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Vansh App Frontend</title></head>
    <body>
      <h1>Hello from Vansh App frontend</h1>
      <p>Served by nginx through the NGINX Ingress Controller.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanshapp-frontend
  labels:
    app: vanshapp
    tier: frontend
    owner: vansh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vanshapp
      tier: frontend
  template:
    metadata:
      labels:
        app: vanshapp
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: vanshapp-frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: vanshapp-frontend
  labels:
    app: vanshapp
    tier: frontend
    owner: vansh
spec:
  type: ClusterIP
  selector:
    app: vanshapp
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
