# Path-based routing on one host: / -> frontend, /api/... -> backend (with /api stripped)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanshapp-ingress
  labels:
    app: vanshapp
    owner: vansh
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: vanshapp.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vanshapp-backend
                port:
                  number: 8080
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vanshapp-frontend
                port:
                  number: 80
