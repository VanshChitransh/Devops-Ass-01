# Vansh's Session 20 monitoring stack: app + node-exporter + Prometheus + Grafana
services:
  app:
    build: ./app
    container_name: s20-app
    ports:
      - "8000:8000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: s20-node-exporter
    # No host root mount: Docker Desktop on macOS does not allow it, so node-exporter
    # reports the Linux VM that runs Docker. On a Linux host add "- /:/host:ro,rslave".
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: s20-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: s20-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # lets the dashboard open without a login (classroom only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
