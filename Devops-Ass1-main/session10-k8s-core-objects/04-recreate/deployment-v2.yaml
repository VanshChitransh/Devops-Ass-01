# Task 13: app-recreate v2 - strategy Recreate (all old pods die before new ones start)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  labels:
    owner: vansh
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v2
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=VERSION: v2 (UPGRADED)"]
          ports:
            - containerPort: 5678
