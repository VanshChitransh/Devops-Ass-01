# Task 12: stable release, 9 replicas (~90% of traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  labels:
    owner: vansh
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        track: stable
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=STABLE v1"]
          ports:
            - containerPort: 5678
