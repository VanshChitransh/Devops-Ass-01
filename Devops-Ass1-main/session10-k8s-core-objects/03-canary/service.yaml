# Task 12: one Service selecting both stable and canary pods (selector app=myapp-canary only)
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary-service
  labels:
    owner: vansh
spec:
  type: NodePort
  selector:
    app: myapp-canary
  ports:
    - port: 80
      targetPort: 5678
      nodePort: 30030
