# Healthy for 10s, then /tmp/healthy disappears -> liveness fails -> kubelet restarts the container
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
  labels: {owner: vansh, demo: lifecycle}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 10; rm -f /tmp/healthy; sleep 600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 1
