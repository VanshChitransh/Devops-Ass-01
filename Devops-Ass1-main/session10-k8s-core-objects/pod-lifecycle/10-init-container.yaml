# Init container must finish before the app container starts
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  labels: {owner: vansh, demo: lifecycle}
spec:
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'init-setup: preparing config for Vansh app'; sleep 5"]
  containers:
    - name: app
      image: nginx:1.27-alpine
