# Traps SIGTERM and cleans up for 8s before exiting; grace period is 30s
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
  labels: {owner: vansh, demo: lifecycle}
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'echo SIGTERM received, cleaning up...; sleep 8; echo done; exit 0' TERM; while true; do sleep 1; done"]
