# App + logging sidecar sharing one Pod -> READY 2/2
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  labels: {owner: vansh, demo: lifecycle}
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"[sidecar] shipping logs for $(hostname)\"; sleep 10; done"]
