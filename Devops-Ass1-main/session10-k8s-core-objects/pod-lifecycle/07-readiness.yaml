# Running but never Ready: the readiness probe looks for a file that is never created
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  labels: {owner: vansh, demo: lifecycle}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        initialDelaySeconds: 2
        periodSeconds: 3
