# Impossible memory request -> stays Pending with FailedScheduling
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
  labels: {owner: vansh, demo: lifecycle}
spec:
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: 900Gi
