# Exits 1 every time; restartPolicy Always -> CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
  labels: {owner: vansh, demo: lifecycle}
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'crashing on purpose'; exit 1"]
