# Task 8: app-rolling v1 - RollingUpdate with maxSurge 1 / maxUnavailable 0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    owner: vansh
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
