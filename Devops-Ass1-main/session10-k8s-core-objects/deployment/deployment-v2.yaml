# Task 8: web Deployment version 2 (nginx:1.27-alpine)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    owner: vansh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        version: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
