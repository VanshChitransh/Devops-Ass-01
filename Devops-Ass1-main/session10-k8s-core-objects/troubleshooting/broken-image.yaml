# Task 9 Drill 1: same Deployment as deployment/deployment-v1.yaml but with a tag that does not exist.
# Applying this on top of the healthy v1 stalls the rollout; the old pods keep serving.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    owner: vansh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        version: broken
    spec:
      containers:
        - name: nginx
          image: nginx:1.99-does-not-exist
          ports:
            - containerPort: 80
