apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "tickethub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend, owner: vansh}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      initContainers:
        # Runs Alembic to head. Several replicas starting at once are serialised by an advisory lock.
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db-secret, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: {{ include "tickethub.databaseUrl" . | quote }}}
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports: [{containerPort: {{ .Values.backend.port }}, name: http}]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-db-secret, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: {{ include "tickethub.databaseUrl" . | quote }}}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "tickethub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  ports: [{name: http, port: {{ .Values.backend.port }}, targetPort: http}]
