# Default values for tickethub. Override with values-local.yaml (kind/minikube) or values-gitops.yaml (Argo CD).
nameOverride: ""

backend:
  image:
    repository: ghcr.io/vanshchitransh/devops-ass-01/tickethub-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  env:
    APP_ENV: kubernetes
    CORS_ORIGINS: "*"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

frontend:
  image:
    repository: ghcr.io/vanshchitransh/devops-ass-01/tickethub-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}

postgres:
  image: postgres:16-alpine
  database: tickethub
  user: tickethub
  password: tickethub-change-me   # override in real environments: --set postgres.password=...
  storage: 1Gi
  storageClassName: ""            # empty = cluster default
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ingress:
  enabled: false
  className: nginx
  host: tickethub.local
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false        # needs the Prometheus Operator CRDs (kube-prometheus-stack)
    interval: 15s
    labels:
      release: monitoring
