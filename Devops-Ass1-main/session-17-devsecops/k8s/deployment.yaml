apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-python
  labels: {app: session17-python, owner: vansh}
spec:
  replicas: 2
  selector:
    matchLabels: {app: session17-python}
  template:
    metadata:
      labels: {app: session17-python, owner: vansh}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: __IMAGE__
          ports:
            - containerPort: 5001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5001}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5001}
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
