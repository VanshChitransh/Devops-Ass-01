# Production-style web app: persistent /data, CPU requests for the HPA, and all three probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production-webapp
  labels: {app: web-app, owner: vansh}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-app}
  template:
    metadata:
      labels: {app: web-app, owner: vansh}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: web-data
