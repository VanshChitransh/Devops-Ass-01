# nginx with a CPU request, which the HPA needs to compute utilisation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  labels: {owner: vansh}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hpa-demo}
  template:
    metadata:
      labels: {app: hpa-demo, owner: vansh}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
