# Pod that mounts the claim; the data lives in the PV, not in the Pod
apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
  labels: {owner: vansh, demo: volumes}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: vansh-pvc
