# emptyDir: scratch space that lives exactly as long as the Pod
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels: {owner: vansh, demo: volumes}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      emptyDir: {}
